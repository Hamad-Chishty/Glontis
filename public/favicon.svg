  <!-- Orange "G" Icon with Upward Arrow notch -->
  <path fill="#F07100" d="M 250 98 C 215 98 185 125 185 165 C 185 205 215 232 250 232 C 280 232 302 214 308 190 L 250 190 L 250 162 L 335 162 L 335 170 C 335 220 298 260 250 260 C 195 260 155 218 155 165 C 155 112 195 70 250 70 C 288 70 320 88 336 118 L 308 134 C 296 113 275 98 250 98 Z" />
  <polygon points="268,140 288,118 308,140" fill="#F07100" />

